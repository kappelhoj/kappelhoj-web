name: Build and Publish to GitHub Pages

on:
  push:
    tags: 
      - '**'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site with Astro
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: ./dist

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages Branch
        uses: actions/checkout@v4
        with: 
          ref: gh-pages

      - name: Clean Existing Files
        run: |
          git rm -rf . 2>/dev/null || true
          rm -rf *

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-publish
          path: .

      - name: Deploy to gh-pages
        run: |
          git config --global user.name "kappelhoj-build"
          git config --global user.email "kappelhoj-build@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_REF##*/}" || echo "No changes to commit"
          git push origin gh-pages
